[pytest]
# Test discovery patterns
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Snapshot testing configuration
# Syrupy will store snapshots in __snapshots__ directory next to the test file

# Markers
markers =
    component: Component analysis tests
    stack: Stack analysis tests
