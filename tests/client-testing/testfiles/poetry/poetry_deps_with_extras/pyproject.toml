[tool.poetry]
name = "test-project"
version = "0.1.0"
description = "Test Poetry with optional dependencies (should be analyzed)"
authors = ["Test <test@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
flask = "2.0.3"
requests = "2.25.1"

[tool.poetry.extras]
security = ["cryptography", "pyOpenSSL"]
extras = ["uvicorn", "click"]

[tool.poetry.dependencies.cryptography]
version = "3.4.8"
optional = true

[tool.poetry.dependencies.pyOpenSSL]
version = "21.0.0"
optional = true

[tool.poetry.dependencies.uvicorn]
version = "0.17.0"
optional = true

[tool.poetry.dependencies.click]
version = "8.0.4"
optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
