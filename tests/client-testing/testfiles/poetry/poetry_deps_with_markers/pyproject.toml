[tool.poetry]
name = "test-project"
version = "0.1.0"
description = "Test Poetry dependencies with Python version and environment markers"
authors = ["Test <test@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
# Regular dependencies
flask = "2.0.3"
requests = "2.25.1"
# Python version constraint - only for Python < 3.11
tomli = { version = "2.0.1", python = "<3.11" }
# Python version constraint - only for Python >= 3.9
typing-extensions = { version = "4.0.0", python = "^3.9" }
# Environment marker - platform specific
pywin32 = { version = "305", markers = "sys_platform == 'win32'" }
# Complex marker - multiple conditions
importlib-metadata = { version = "4.0.0", markers = "python_version >= '3.6' and python_version < '3.10'" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
