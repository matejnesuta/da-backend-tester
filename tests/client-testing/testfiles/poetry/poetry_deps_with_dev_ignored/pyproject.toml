[tool.poetry]
name = "test-project"
version = "0.1.0"
description = "Test that dev dependencies are NOT analyzed"
authors = ["Test <test@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
flask = "2.0.3"
requests = "2.25.1"
