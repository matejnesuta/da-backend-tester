[project]
name = "test-project"
version = "0.1.0"
description = "Test uv version specifier variations (ranges, compatible release, wildcards)"
dependencies = [
    "flask >=2.0.0,<3.0.0",        # Range
    "requests ==2.25.1",            # Exact version
    "click ~=8.0",                  # Compatible release: >=8.0,<9.0
    "uvicorn ==0.17.*",             # Wildcard: >=0.17.0,<0.18.0
    "certifi >=2023.7.0",           # Minimum version
    "beautifulsoup4 <5",            # Maximum version
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
