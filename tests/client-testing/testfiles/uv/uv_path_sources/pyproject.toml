[project]
name = "test-project"
version = "0.1.0"
description = "Test uv path source dependencies using tool.uv.sources"
dependencies = [
    "flask==2.0.3",
    "requests==2.25.1",
    "my-local-package",
]

[tool.uv.sources]
# Path dependency (relative path)
my-local-package = { path = "./local-package/" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
