[project]
name = "test-project"
version = "0.1.0"
description = "Test uv git source dependencies using tool.uv.sources"
dependencies = [
    "flask==2.0.3",
    "requests",
    "pyyaml",
    "certifi",
]

[tool.uv.sources]
# Git dependency with specific tag
requests = { git = "https://github.com/psf/requests.git", tag = "v2.25.1" }
# Git dependency with branch
pyyaml = { git = "https://github.com/yaml/pyyaml.git", branch = "main" }
# Git dependency with specific revision
certifi = { git = "https://github.com/certifi/python-certifi.git", rev = "2023.07.22" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
