[project]
name = "test-project"
version = "0.1.0"
description = "Test uv with environment markers (platform/Python version specific)"
dependencies = [
    "flask==2.0.3",
    "requests==2.25.1",
    # Python version constraint - only for Python < 3.11
    "tomli >=2.0.1,<3; python_version < '3.11'",
    # Python version constraint - only for Python >= 3.9 and < 4.0
    "pathlib2 >=2.2.0,<3; python_version >= '3.9' and python_version < '4.0'",
    # Platform specific - Windows only
    "colorama >=0.4.6,<5; platform_system == 'Windows'",
    # Platform specific - Linux only
    "uvloop >=0.17.0; sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
