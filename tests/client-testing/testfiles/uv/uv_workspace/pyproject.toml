[project]
name = "test-workspace"
version = "0.1.0"
description = "Test uv workspace with basic dependencies"
requires-python = ">=3.11"
dependencies = [
    "package-a",
    "package-b",
]

[tool.uv.sources]
package-a = { workspace = true }
package-b = { workspace = true }  # Also referenced by package-a

[tool.uv.workspace]
members = [
    "package-a",
    "package-b",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
