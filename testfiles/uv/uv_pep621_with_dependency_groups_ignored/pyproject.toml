[project]
name = "test-project"
version = "0.1.0"
description = "Test that dependency-groups (PEP 735) are NOT analyzed"
dependencies = [
    "flask==2.0.3",
    "requests==2.25.1",
    "uvicorn==0.17.0",
]

[dependency-groups]
dev = ["pytest>=7.2.0", "black>=22.10.0"]
test = ["coverage>=6.5.0", "pytest-cov>=4.0.0"]
# These dependency-groups should NOT appear in the analysis

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
